<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Chirp Board</title>
  <link rel="stylesheet" href="/static/board.css">
</head>
<body class="board-public">

</html>
